[project]
name = "django-bulk-copy"
version = "0.2.0"
description = "Faster way to create your models in Django"
authors = [{ name = "Ahmet Burak Ozyurt", email = "ahmetbozyurtt@gmail.com" }]
requires-python = ">=3.10,<4.0"
maintainers = [
    { name = "Ahmet Burak Ozyurt", email = "ahmetbozyurtt@gmail.com" },
    { name = "Onuralp SEZER", email = "thunderbirdtr@gmail.com" },
]
keywords = [
    "django",
    "postgres",
    "django-bulk-copy",
    "bulk",
    "t-sql",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["django>=3"]

[project.optional-dependencies]
postgres-binary = ["psycopg2-binary>=2.9.10,<3"]
postgres = ["psycopg2>=2.9.10,<3"]

[project.urls]
homepage = "https://github.com/ahmetveburak/django-bulk-copy"
repository = "https://github.com/ahmetveburak/django-bulk-copy"
documentation = "https://github.com/ahmetveburak/django-bulk-copy/blob/main/README.md"

[dependency-groups]
dev = [
    "mypy>=1.11,<2",
    "pre-commit>=4.0.1,<5",
    "ruff>=0.6.9,<0.7",
    "tox>=4.22.0,<5",
    "pytest-django>=4.9.0,<5",
    "pytest-cov>=5.0.0,<6",
    "pytest-mock>=3.14.0,<4",
    "django-stubs[compatible-mypy]>=5.1.0,<6",
]

[tool.hatch.build.targets.sdist]
include = [
    "bulk_copy",
    "bulk_copy/py.typed",
]
exclude = ["tests/"]

[tool.hatch.build.targets.wheel]
include = [
    "bulk_copy",
    "bulk_copy/py.typed",
]
exclude = ["tests/"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE="tests.settings"
addopts = "--cov=bulk_copy --cov-report=term-missing"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "pass",
    "NotImplementedError",
    "if typing.TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py312"
# Exclude a variety of commonly ignored directories.
extend-exclude = []
# Same as Black.
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["A", "B", "C", "D", "E", "F", "I"]
unfixable = []
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
per-file-ignores = { }

[tool.bandit]
target = ["bulk_copy"]
exclude_dirs = ["tests/"]
skips = ["B101", "B311"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "tests.settings"
