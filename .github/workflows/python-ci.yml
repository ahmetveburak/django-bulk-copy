name: Python-CI
on: [push, pull_request, workflow_dispatch]
jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 🐘 Run PostgreSQL container
        run: docker run -d --name bulk_copy -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=postgres -e POSTGRES_HOST=localhost -e POSTGRES_PORT=5432 -p 5432:5432 postgres

      - name: Install the latest version of uv 🌟
        uses: astral-sh/setup-uv@v3

      - name: 📦 Install the base dependencies
        run: |
             uv pip install psycopg2-binary pytest coverage pytest-cov pytest_mock pytest-django ruff mypy bandit django-stubs --system
             uv pip install -e . --system

      - name: 🔍 Run Ruff linter
        run: ruff check bulk_copy tests

      - name: 🔎 Run mypy type checker
        run: mypy bulk_copy

      - name: 🔒 Run Bandit security scanner
        run: bandit -c pyproject.toml -r bulk_copy

      - name: 📜 Migrations
        env:
          DJANGO_SETTINGS_MODULE: tests.settings
        run: python manage.py migrate

      - name: 🧪 Run tests
        env:
          DJANGO_SETTINGS_MODULE: tests.settings
        run: pytest ./tests --cov=bulk_copy --cov-report=term-missing --cov-fail-under=80
