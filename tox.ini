[tox]
skip_missing_interpreters = true
envlist =
    py{310,311,312,313}-psycopg2
    py{310,311,312,313}-psycopg3

[testenv]
allowlist_externals = docker,sh,docker-compose,python
deps =
    pytest
    pytest-cov
    pytest_mock
    coverage
    pytest-django
    django>=3
    psycopg2: psycopg2-binary
    psycopg3: psycopg[binary]
commands_pre =
    docker-compose up -d
    sh -c 'sleep 2'
    python manage.py migrate
commands = pytest tests/
commands_post =
    docker-compose down -v
setenv =
    PYTHONDONTWRITEBYTECODE=1
    DJANGO_SETTINGS_MODULE=tests.settings
